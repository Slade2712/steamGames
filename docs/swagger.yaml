basePath: /api/v1
definitions:
  handler.HealthCheckSuccess:
    properties:
      database:
        example: true
        type: boolean
      message:
        example: OK
        type: string
    type: object
  handler.HealthCheckUnavailable:
    properties:
      database:
        example: false
        type: boolean
      message:
        example: Database unavailable
        type: string
    type: object
  internal_models_games.Category:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  internal_models_games.Genre:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  models.Game:
    properties:
      _id:
        type: integer
      categories:
        items:
          $ref: '#/definitions/internal_models_games.Category'
        type: array
      description:
        type: string
      developers:
        items:
          type: string
        type: array
      genres:
        items:
          $ref: '#/definitions/internal_models_games.Genre'
        type: array
      image:
        type: string
      is_free:
        type: boolean
      metacritic_score:
        type: integer
      platforms:
        items:
          type: string
        type: array
      price:
        type: number
      publishers:
        items:
          type: string
        type: array
      recommendations:
        type: integer
      release_date:
        type: string
      release_year:
        type: integer
      required_age:
        type: string
      title:
        type: string
      website:
        type: string
    type: object
  models.GamesLinks:
    properties:
      next:
        type: string
      self:
        type: string
    type: object
  models.GamesResponse:
    properties:
      _links:
        $ref: '#/definitions/models.GamesLinks'
      items:
        items:
          $ref: '#/definitions/models.Game'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  responses.GenericResponse:
    properties:
      message:
        example: Invalid request
        type: string
      success:
        example: false
        type: boolean
    type: object
info:
  contact: {}
  description: API REST pour consulter les jeux Steam.
  title: Steam Games API
  version: "1.0"
paths:
  /games:
    get:
      description: |-
        Retourne une liste paginée de jeux Steam.
        Les résultats peuvent être filtrés par titre, année de sortie, plateforme et genre.
        Le tri est effectué sur le titre du jeu.
        Si limit est supérieur à 100, sa valeur est automatiquement limitée à 100.
      operationId: get-games
      parameters:
      - default: 10
        description: Nombre maximum de jeux retournés
        example: 10
        in: query
        name: limit
        type: integer
      - default: 0
        description: Nombre de jeux à ignorer avant de commencer la liste
        example: 0
        in: query
        name: skip
        type: integer
      - default: title
        description: Ordre de tri par titre
        enum:
        - title
        - -title
        example: title
        in: query
        name: ordering
        type: string
      - description: Recherche partielle dans le titre du jeu, insensible à la casse
        example: Subnautica
        in: query
        name: title
        type: string
      - description: Filtrer les jeux par année de sortie
        example: 2013
        in: query
        name: release_year
        type: integer
      - description: Filtrer les jeux par nom de plateforme
        example: linux
        in: query
        name: platforms
        type: string
      - description: Filtrer par un ou plusieurs IDs de genres séparés par des virgules
        example: 2,25
        in: query
        name: genre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Liste des jeux récupérée avec succès
          schema:
            $ref: '#/definitions/models.GamesResponse'
        "400":
          description: Paramètre de requête invalide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la récupération des jeux
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Lister les jeux
      tags:
      - Games
  /games/{id}:
    get:
      description: |-
        Retourne toutes les informations disponibles pour un jeu Steam.
        La réponse contient notamment les développeurs, éditeurs, plateformes, catégories et genres associés au jeu.
      operationId: get-game-by-id
      parameters:
      - description: Identifiant Steam du jeu
        example: 570
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Jeu récupéré avec succès
          schema:
            $ref: '#/definitions/models.Game'
        "400":
          description: L'identifiant fourni n'est pas un entier valide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "404":
          description: Aucun jeu correspondant à cet ID
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la récupération du jeu
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Récupérer un jeu par son ID
      tags:
      - Games
  /health:
    get:
      description: |-
        Vérifie que l'API fonctionne et que la connexion à la base de données PostgreSQL est disponible.
        La connexion à PostgreSQL est testée avec un délai maximum de 2 secondes.
      operationId: health-check
      produces:
      - application/json
      responses:
        "200":
          description: API opérationnelle et base de données disponible
          schema:
            $ref: '#/definitions/handler.HealthCheckSuccess'
        "503":
          description: Base de données indisponible
          schema:
            $ref: '#/definitions/handler.HealthCheckUnavailable'
      summary: Vérifier l'état de santé de l'API
      tags:
      - Health
swagger: "2.0"
