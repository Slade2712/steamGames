basePath: /api/v1
definitions:
  handler.HealthCheckSuccess:
    properties:
      database:
        example: true
        type: boolean
      message:
        example: OK
        type: string
    type: object
  handler.HealthCheckUnavailable:
    properties:
      database:
        example: false
        type: boolean
      message:
        example: Database unavailable
        type: string
    type: object
  internal_models_games.Category:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  internal_models_games.Genre:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  models.Game:
    properties:
      _id:
        type: integer
      categories:
        items:
          $ref: '#/definitions/internal_models_games.Category'
        type: array
      description:
        type: string
      developers:
        items:
          type: string
        type: array
      genres:
        items:
          $ref: '#/definitions/internal_models_games.Genre'
        type: array
      image:
        type: string
      is_free:
        type: boolean
      metacritic_score:
        type: integer
      platforms:
        items:
          type: string
        type: array
      price:
        type: number
      publishers:
        items:
          type: string
        type: array
      recommendations:
        type: integer
      release_date:
        type: string
      release_year:
        type: integer
      required_age:
        type: string
      title:
        type: string
      website:
        type: string
    type: object
  models.GamesLinks:
    properties:
      next:
        type: string
      self:
        type: string
    type: object
  models.GamesResponse:
    properties:
      _links:
        $ref: '#/definitions/models.GamesLinks'
      items:
        items:
          $ref: '#/definitions/models.Game'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  responses.GenericResponse:
    properties:
      message:
        example: Invalid request
        type: string
      success:
        example: false
        type: boolean
    type: object
  users.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  users.LoginResponse:
    properties:
      expires_in:
        type: integer
      token:
        type: string
      token_type:
        type: string
    type: object
  users.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
info:
  contact: {}
  description: API REST permettant de consulter les jeux Steam et de gérer les utilisateurs.
  title: Steam Games API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authentifie un utilisateur à partir de son adresse e-mail et de son mot de passe.
        En cas de succès, retourne un token JWT de type Bearer ainsi que sa durée de validité.
      operationId: login-user
      parameters:
      - description: Identifiants de connexion
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authentification réussie
          schema:
            $ref: '#/definitions/users.LoginResponse'
        "400":
          description: Corps JSON invalide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "401":
          description: Adresse e-mail ou mot de passe incorrect
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de l'authentification
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Se connecter
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Crée un nouveau compte utilisateur à partir d'une adresse e-mail et d'un mot de passe.
        Le mot de passe doit contenir entre 10 et 72 caractères.
      operationId: register-user
      parameters:
      - description: Informations nécessaires à la création du compte
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Compte créé avec succès
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: JSON invalide, adresse e-mail invalide ou mot de passe invalide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "409":
          description: Adresse e-mail déjà utilisée
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la création du compte
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Créer un compte utilisateur
      tags:
      - Auth
  /games:
    get:
      description: |-
        Retourne une liste paginée de jeux Steam.
        Les résultats peuvent être filtrés par titre, année de sortie, plateforme et genre.
        Le tri est effectué sur le titre du jeu.
        Si limit est supérieur à 100, sa valeur est automatiquement limitée à 100.
      operationId: get-games
      parameters:
      - default: 10
        description: Nombre maximum de jeux retournés
        example: 10
        in: query
        name: limit
        type: integer
      - default: 0
        description: Nombre de jeux à ignorer avant de commencer la liste
        example: 0
        in: query
        name: skip
        type: integer
      - default: title
        description: Ordre de tri par titre
        enum:
        - title
        - -title
        example: title
        in: query
        name: ordering
        type: string
      - description: Recherche partielle dans le titre du jeu, insensible à la casse
        example: Subnautica
        in: query
        name: title
        type: string
      - description: Filtrer les jeux par année de sortie
        example: 2013
        in: query
        name: release_year
        type: integer
      - description: Filtrer les jeux par nom de plateforme
        example: linux
        in: query
        name: platforms
        type: string
      - description: Filtrer par un ou plusieurs IDs de genres séparés par des virgules
        example: 2,25
        in: query
        name: genre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Liste des jeux récupérée avec succès
          schema:
            $ref: '#/definitions/models.GamesResponse'
        "400":
          description: Paramètre de requête invalide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la récupération des jeux
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Lister les jeux
      tags:
      - Games
  /games/{id}:
    get:
      description: |-
        Retourne toutes les informations disponibles pour un jeu Steam.
        La réponse contient notamment les développeurs, éditeurs, plateformes, catégories et genres associés au jeu.
      operationId: get-game-by-id
      parameters:
      - description: Identifiant Steam du jeu
        example: 570
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Jeu récupéré avec succès
          schema:
            $ref: '#/definitions/models.Game'
        "400":
          description: L'identifiant fourni n'est pas un entier valide
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "404":
          description: Aucun jeu correspondant à cet ID
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la récupération du jeu
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      summary: Récupérer un jeu par son ID
      tags:
      - Games
  /health:
    get:
      description: |-
        Vérifie que l'API fonctionne et que la connexion à la base de données PostgreSQL est disponible.
        La connexion à PostgreSQL est testée avec un délai maximum de 2 secondes.
      operationId: health-check
      produces:
      - application/json
      responses:
        "200":
          description: API opérationnelle et base de données disponible
          schema:
            $ref: '#/definitions/handler.HealthCheckSuccess'
        "503":
          description: Base de données indisponible
          schema:
            $ref: '#/definitions/handler.HealthCheckUnavailable'
      summary: Vérifier l'état de santé de l'API
      tags:
      - Health
  /users:
    get:
      description: |-
        Retourne la liste de tous les utilisateurs enregistrés dans l'application.
        Le token doit être envoyé sous la forme : Bearer <token>.
      operationId: get-all-users
      produces:
      - application/json
      responses:
        "200":
          description: Liste des utilisateurs
          schema:
            items:
              $ref: '#/definitions/users.UserResponse'
            type: array
        "401":
          description: Token absent, invalide ou expiré
          schema:
            $ref: '#/definitions/responses.GenericResponse'
        "500":
          description: Erreur interne lors de la récupération des utilisateurs
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      security:
      - BearerAuth: []
      summary: Lister les utilisateurs
      tags:
      - Users
  /users/me:
    get:
      description: |-
        Retourne les informations de l'utilisateur correspondant au token JWT envoyé dans l'en-tête Authorization.
        Le token doit être envoyé sous la forme : Bearer <token>.
      operationId: get-current-user
      produces:
      - application/json
      responses:
        "200":
          description: Utilisateur authentifié
          schema:
            $ref: '#/definitions/users.UserResponse'
        "401":
          description: Token absent, invalide ou expiré
          schema:
            $ref: '#/definitions/responses.GenericResponse'
      security:
      - BearerAuth: []
      summary: Récupérer mon profil
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Vérification de l'état de santé de l'API.
  name: Health
- description: Inscription et authentification des utilisateurs.
  name: Auth
- description: Gestion des comptes utilisateurs.
  name: Users
- description: Consultation, recherche, filtrage et pagination des jeux Steam.
  name: Games
