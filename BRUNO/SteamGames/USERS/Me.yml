info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", () => {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
